AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  RiddleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: RiddleFunction
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Timeout: 30
      Policies:
      - AmazonBedrockFullAccess
      Events:
        RiddleApi:
          Type: HttpApi
          Properties:
            Path: /riddle
            Method: ANY
            ApiId:
              Ref: RiddleApi
    Metadata:
      SamResourceId: RiddleFunction
  RiddleApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
        - https://iamteren.github.io
        AllowHeaders:
        - Content-Type
        AllowMethods:
        - POST
        - OPTIONS
        MaxAge: 600
Outputs:
  ApiUrl:
    Value:
      Fn::Sub: https://${RiddleApi}.execute-api.${AWS::Region}.amazonaws.com/riddle
