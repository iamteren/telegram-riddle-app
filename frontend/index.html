<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coding Riddle Agent</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1e1e1e; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #riddle-box { padding: 16px; background: #252526; font-size: 14px; white-space: pre-wrap; min-height: 120px; border-bottom: 1px solid #444; }
    #editor { flex: 1; }
    #run-btn { padding: 14px; background: #0078d4; color: white; border: none; font-size: 16px; cursor: pointer; }
    #run-btn:hover { background: #005fa3; }
    #output { padding: 12px; background: #1a1a2e; font-size: 13px; white-space: pre-wrap; min-height: 80px; border-top: 1px solid #444; }
  </style>
</head>
<body>
  <div id="riddle-box">⏳ Loading your first riddle...</div>
  <div id="editor"></div>
  <button id="run-btn" onclick="submitAnswer()">Submit Answer ▶</button>
  <div id="output"></div>

  <script>
    const API_URL = "https://ecpgnobp85.execute-api.us-east-1.amazonaws.com/riddle"; // ← paste your SAM output URL here

    require.config({ paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs" }});
    require(["vs/editor/editor.main"], function () {
      window.editor = monaco.editor.create(document.getElementById("editor"), {
        value: "# Write your answer or solution here\n",
        language: "python",
        theme: "vs-dark",
        fontSize: 14,
        minimap: { enabled: false },
        automaticLayout: true
      });
    });

    async function callAgent(input) {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ input })
      });
      const data = await res.json();
      return data.reply;
    }

    async function submitAnswer() {
      const code = window.editor.getValue();
      document.getElementById("output").innerText = "⏳ Evaluating...";
      const reply = await callAgent(code);
      document.getElementById("output").innerText = reply;
    }

    // Load first riddle automatically
    callAgent("Give me a medium difficulty data structure riddle.").then(reply => {
      document.getElementById("riddle-box").innerText = reply;
    });
  </script>
</body>
</html>
