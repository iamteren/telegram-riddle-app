<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coding Riddle Agent</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    #topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: #161b22; border-bottom: 1px solid #30363d; }
    #topbar h2 { font-size: 15px; color: #58a6ff; }
    #score-badge { background: #238636; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
    #difficulty-select { background: #21262d; color: #e6edf3; border: 1px solid #30363d; padding: 4px 8px; border-radius: 6px; font-size: 13px; }

    #main { display: flex; flex: 1; overflow: hidden; }
    #drag-handle { width: 5px; background: #30363d; cursor: col-resize; flex-shrink: 0; }
    #drag-handle:hover { background: #58a6ff; }

    #problem-panel { width: 40%; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; overflow: hidden; }
    #problem-header { padding: 12px 16px; background: #21262d; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    #problem-title { font-size: 14px; font-weight: bold; color: #58a6ff; }
    #problem-tags { font-size: 11px; color: #8b949e; }

    #history-panel { border-bottom: 1px solid #30363d; flex-shrink: 0; max-height: 140px; overflow-y: auto; background: #0d1117; }
    #history-header { padding: 6px 16px; font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; background: #161b22; border-bottom: 1px solid #30363d; }
    .hist-item { padding: 6px 16px; cursor: pointer; font-size: 12px; color: #c9d1d9; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #21262d; }
    .hist-item:hover { background: #21262d; }
    .hist-item.active { background: #1f3a5f; color: #58a6ff; }
    .hist-num { color: #58a6ff; font-size: 11px; min-width: 24px; }
    .hist-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hist-solved { color: #3fb950; font-size: 11px; }

    #problem-body { padding: 16px; overflow-y: auto; flex: 1; font-size: 13px; line-height: 1.7; }
    #problem-body h1, #problem-body h2, #problem-body h3 { color: #58a6ff; margin: 12px 0 6px; font-size: 14px; }
    #problem-body code { background: #21262d; padding: 2px 6px; border-radius: 4px; font-family: monospace; color: #f0883e; }
    #problem-body pre { background: #21262d; padding: 12px; border-radius: 6px; overflow-x: auto; margin: 8px 0; }
    #problem-body pre code { background: none; padding: 0; color: #e6edf3; }
    #problem-body strong { color: #e6edf3; }
    #problem-body ul, #problem-body ol { padding-left: 20px; margin: 6px 0; }

    #hint-box { padding: 12px 16px; background: #1c2128; border-top: 1px solid #30363d; font-size: 12px; color: #f0883e; display: none; flex-shrink: 0; }
    #hint-btn { margin: 8px 16px; padding: 6px 12px; background: #21262d; border: 1px solid #30363d; color: #8b949e; border-radius: 6px; cursor: pointer; font-size: 12px; flex-shrink: 0; }
    #hint-btn:hover { border-color: #58a6ff; color: #58a6ff; }

    #editor-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #editor-topbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #161b22; border-bottom: 1px solid #30363d; }
    #lang-label { font-size: 12px; color: #8b949e; }
    #editor { flex: 1; }

    #bottom-bar { display: flex; gap: 8px; padding: 10px 12px; background: #161b22; border-top: 1px solid #30363d; }
    #run-btn { flex: 1; padding: 10px; background: #238636; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
    #run-btn:hover { background: #2ea043; }
    #next-btn { padding: 10px 16px; background: #21262d; color: #58a6ff; border: 1px solid #30363d; border-radius: 6px; font-size: 14px; cursor: pointer; }
    #next-btn:hover { border-color: #58a6ff; }

    #output-panel { height: 160px; background: #0d1117; border-top: 1px solid #30363d; overflow-y: auto; padding: 12px 16px; font-size: 13px; font-family: monospace; }
    .output-correct { color: #3fb950; }
    .output-wrong { color: #f85149; }
    .output-thinking { color: #8b949e; font-style: italic; }

    #loading { position: fixed; inset: 0; background: #0d1117; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    #loading h3 { color: #58a6ff; margin-bottom: 12px; }
    .spinner { width: 40px; height: 40px; border: 3px solid #30363d; border-top-color: #58a6ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Fallback textarea when Monaco fails */
    #code-fallback { flex: 1; background: #0d1117; color: #e6edf3; border: none; padding: 16px; font-family: monospace; font-size: 14px; resize: none; outline: none; display: none; }
  </style>
</head>
<body>

<div id="loading">
  <h3>Coding Riddle Agent</h3>
  <div class="spinner"></div>
  <p style="color:#8b949e; margin-top:12px; font-size:13px;">Loading your challenge...</p>
</div>

<div id="topbar">
  <h2>⚡ Coding Riddles</h2>
  <select id="difficulty-select" onchange="loadNewRiddle()">
    <option value="easy">Easy</option>
    <option value="medium" selected>Medium</option>
    <option value="hard">Hard</option>
    <option value="amazon SDE1">Amazon SDE-1</option>
    <option value="amazon SDE2">Amazon SDE-2</option>
  </select>
  <div id="score-badge">Score: <span id="score-val">0</span></div>
</div>

<div id="main">
  <div id="problem-panel">
    <div id="problem-header">
      <span id="problem-title">Problem #1</span>
      <span id="problem-tags">Arrays · Medium</span>
    </div>
    <div id="history-panel">
      <div id="history-header">Past Problems</div>
      <div id="history-list"></div>
    </div>
    <div id="problem-body">Loading...</div>
    <button id="hint-btn" onclick="getHint()">💡 Get Hint</button>
    <div id="hint-box"></div>
  </div>

  <div id="drag-handle"></div>
  <div id="editor-panel">
    <div id="editor-topbar">
      <span id="lang-label">Python 3</span>
      <span style="font-size:12px; color:#8b949e;">Write your solution below</span>
    </div>
    <div id="editor"></div>
    <textarea id="code-fallback" placeholder="# Write your solution here&#10;&#10;def solution():&#10;    pass"></textarea>
    <div id="bottom-bar">
      <button id="run-btn" onclick="submitAnswer()">▶ Submit Solution</button>
      <button id="next-btn" onclick="loadNewRiddle()">Next →</button>
    </div>
    <div id="output-panel"><span class="output-thinking">Output will appear here...</span></div>
  </div>
</div>

<script>
  const API_URL = "https://yax7kpyns0.execute-api.us-east-1.amazonaws.com/riddle";

  // --- State ---
  let score = parseInt(localStorage.getItem("riddleScore") || "0");
  let problemCount = parseInt(localStorage.getItem("riddleProblemCount") || "1");
  let chatHistory = JSON.parse(localStorage.getItem("riddleChatHistory") || "null");
  let problemHistory = JSON.parse(localStorage.getItem("riddleProblemHistory") || "[]");
  let currentProblemIndex = parseInt(localStorage.getItem("riddleCurrentIndex") || "-1");

  document.getElementById("score-val").innerText = score;

  // --- Code editor helpers (Monaco or fallback textarea) ---
  function getCode() {
    if (window.editor) return window.editor.getValue();
    return document.getElementById("code-fallback").value;
  }
  function setCode(val) {
    if (window.editor) window.editor.setValue(val);
    else document.getElementById("code-fallback").value = val;
  }

  // --- Start app immediately — don't wait for Monaco ---
  document.addEventListener("DOMContentLoaded", function () {
    const saved = localStorage.getItem("riddleCurrentProblem");
    if (saved) {
      const p = JSON.parse(saved);
      displayProblem(p.title, p.tags, p.body);
      document.getElementById("loading").style.display = "none";
    } else {
      loadNewRiddle();
    }

    // Load Monaco in background — enhances editor if it loads, no-op if it doesn't
    const monacoScript = document.createElement("script");
    monacoScript.src = "https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js";
    monacoScript.onload = function () {
      require.config({ paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs" }});
      require(["vs/editor/editor.main"], function () {
        window.editor = monaco.editor.create(document.getElementById("editor"), {
          value: document.getElementById("code-fallback").value,
          language: "python",
          theme: "vs-dark",
          fontSize: 14,
          minimap: { enabled: false },
          automaticLayout: true,
          scrollBeyondLastLine: false
        });
        // Hide fallback, show Monaco
        document.getElementById("code-fallback").style.display = "none";
        document.getElementById("editor").style.display = "flex";
      });
    };
    // Show fallback textarea immediately while Monaco loads
    document.getElementById("editor").style.display = "none";
    document.getElementById("code-fallback").style.display = "block";
    document.head.appendChild(monacoScript);
  });

  // --- Problem History ---
  function saveProblem(title, tags, body) {
    const p = { title, tags, body, solved: false };
    localStorage.setItem("riddleCurrentProblem", JSON.stringify(p));
    const exists = problemHistory.findIndex(x => x.title === title);
    if (exists === -1) {
      problemHistory.push(p);
      currentProblemIndex = problemHistory.length - 1;
    } else {
      currentProblemIndex = exists;
    }
    localStorage.setItem("riddleProblemHistory", JSON.stringify(problemHistory));
    localStorage.setItem("riddleCurrentIndex", currentProblemIndex);
    renderHistoryList();

  // Resizable sidebar
  const handle = document.getElementById("drag-handle");
  const panel = document.getElementById("problem-panel");
  let dragging = false;
  handle.addEventListener("mousedown", e => { dragging = true; document.body.style.cursor = "col-resize"; e.preventDefault(); });
  document.addEventListener("mousemove", e => { if (!dragging) return; const w = Math.min(window.innerWidth * 0.7, Math.max(200, e.clientX)); panel.style.width = w + "px"; });
  document.addEventListener("mouseup", () => { dragging = false; document.body.style.cursor = ""; });
  }

  function displayProblem(title, tags, body) {
    document.getElementById("problem-title").innerText = title;
    document.getElementById("problem-tags").innerText = tags;
    document.getElementById("problem-body").innerHTML = marked.parse(body);
    document.getElementById("hint-box").style.display = "none";
    document.getElementById("hint-box").innerHTML = "";
    renderHistoryList();

  document.addEventListener("mouseup", () => { dragging = false; document.body.style.cursor = ""; });
  }

  function renderHistoryList() {
    const container = document.getElementById("history-list");
    if (!container || problemHistory.length === 0) return;
    container.innerHTML = problemHistory.map((p, i) => `
      <div class="hist-item ${i === currentProblemIndex ? 'active' : ''}" onclick="loadFromHistory(${i})">
        <span class="hist-num">#${i + 1}</span>
        <span class="hist-title">${p.title}</span>
        ${p.solved ? '<span class="hist-solved">✓</span>' : ''}
      </div>
    `).join("");
  }

  function loadFromHistory(index) {
    currentProblemIndex = index;
    localStorage.setItem("riddleCurrentIndex", index);
    const p = problemHistory[index];
    localStorage.setItem("riddleCurrentProblem", JSON.stringify(p));
    chatHistory = null;
    localStorage.removeItem("riddleChatHistory");
    displayProblem(p.title, p.tags, p.body);
    document.getElementById("output-panel").innerHTML = '<span class="output-thinking">Output will appear here...</span>';
    setCode("# Write your solution here\n\ndef solution():\n    pass\n");
  }

  // --- API ---
  async function callAgent(input) {
    const body = { input, chat_history: chatHistory };
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (data.chat_history) {
      chatHistory = data.chat_history;
      localStorage.setItem("riddleChatHistory", JSON.stringify(chatHistory));
    }
    return data.reply;
  }

  // --- Load New Problem ---
  async function loadNewRiddle() {
    document.getElementById("loading").style.display = "flex";
    document.getElementById("output-panel").innerHTML = '<span class="output-thinking">Output will appear here...</span>';
    setCode("# Write your solution here\n\ndef solution():\n    pass\n");
    chatHistory = null;
    localStorage.removeItem("riddleChatHistory");

    const difficulty = document.getElementById("difficulty-select").value;
    const prompt = `Give me a NEW ${difficulty} difficulty coding problem. Format it exactly like this:
TITLE: [short title]
TAGS: [topic tags]
PROBLEM:
[full problem description with examples, constraints, and expected input/output]
Do not give the solution yet.`;

    try {
      const reply = await callAgent(prompt);
      const titleMatch = reply.match(/TITLE:\s*(.+)/);
      const tagsMatch = reply.match(/TAGS:\s*(.+)/);
      const problemMatch = reply.match(/PROBLEM:\s*([\s\S]+)/);

      const title = `Problem #${problemCount} - ${titleMatch ? titleMatch[1].trim() : "Challenge"}`;
      const tags = tagsMatch ? tagsMatch[1].trim() : difficulty;
      const body = problemMatch ? problemMatch[1].trim() : reply;

      problemCount++;
      localStorage.setItem("riddleProblemCount", problemCount);

      saveProblem(title, tags, body);
      displayProblem(title, tags, body);
    } catch(e) {
      document.getElementById("problem-body").innerHTML = "Error loading problem. Check your API URL.";
    }
    document.getElementById("loading").style.display = "none";
  }

  // --- Submit Answer ---
  async function submitAnswer() {
    const code = getCode();
    document.getElementById("output-panel").innerHTML = '<span class="output-thinking">⏳ Evaluating your solution...</span>';
    document.getElementById("run-btn").disabled = true;

    try {
      const reply = await callAgent(
        `Here is my solution attempt:\n\`\`\`python\n${code}\n\`\`\`\nEvaluate it. Is it correct? Give detailed feedback, time/space complexity, and if wrong, explain why without giving the full answer.`
      );

      const isCorrect = /correct|well done|great|perfect|passes|accepted/i.test(reply);
      const isWrong = /wrong|incorrect|fails|error|not quite|off/i.test(reply);

      if (isCorrect) {
        score += 10;
        localStorage.setItem("riddleScore", score);
        document.getElementById("score-val").innerText = score;
        if (currentProblemIndex >= 0) {
          problemHistory[currentProblemIndex].solved = true;
          localStorage.setItem("riddleProblemHistory", JSON.stringify(problemHistory));
          renderHistoryList();

  document.addEventListener("mouseup", () => { dragging = false; document.body.style.cursor = ""; });
        }
        document.getElementById("output-panel").innerHTML =
          `<span class="output-correct">✅ Correct! +10 points\n\n${reply}</span>`;
      } else if (isWrong) {
        document.getElementById("output-panel").innerHTML =
          `<span class="output-wrong">❌ Not quite...\n\n${reply}</span>`;
      } else {
        document.getElementById("output-panel").innerHTML = reply;
      }
    } catch(e) {
      document.getElementById("output-panel").innerHTML =
        '<span class="output-wrong">Error connecting to agent.</span>';
    }
    document.getElementById("run-btn").disabled = false;
  }

  // --- Hint ---
  async function getHint() {
    document.getElementById("hint-box").style.display = "block";
    document.getElementById("hint-box").innerHTML = "💡 Getting hint...";
    const hint = await callAgent("Give me a hint for this problem without revealing the solution.");
    document.getElementById("hint-box").innerHTML = "💡 " + marked.parse(hint);
  }

  renderHistoryList();

  document.addEventListener("mouseup", () => { dragging = false; document.body.style.cursor = ""; });
</script>
</body>
</html>
