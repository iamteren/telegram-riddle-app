AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Resources:
  RiddleAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: coding-riddle-agent
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      CodeUri: lambda/
      Timeout: 30
      Policies:
        - Statement:
            Effect: Allow
            Action: bedrock:InvokeModel
            Resource: "*"
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /riddle
            Method: POST

Outputs:
  ApiUrl:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.us-east-1.amazonaws.com/riddle"
